name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Monarch_Vellore-Institute-of-Technology
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv -r requirements.lock
          uv pip install --python .venv -e .
      - name: Lint
        run: .venv/bin/python -m ruff check .
      - name: Tests (fast suite; data/network/slow tests run locally)
        run: .venv/bin/python -m pytest -m "not slow and not data and not net"
