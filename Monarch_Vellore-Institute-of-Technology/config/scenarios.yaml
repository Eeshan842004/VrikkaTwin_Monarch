# Demo scenarios kept as tests (Decisions v1 item 16): S1-S6 here; S10 (implausible feed) and S11 (consent revoked)
# belong to the trust layer (Part 6). All personas are FICTIONAL. Days are offsets from the start of the city's
# hottest 3-day window in May 2024 (day 0 = first hot day); the replay starts `lead_in` days earlier.
# Drug names are generic first. `truth` = physiology engine with the person's true sweat/drinking (demo replay).
S1_kamala:
  label: "Kamala (fictional), 68, home-based, Nagpur: ARB + thiazide-type diuretic, ibuprofen painkiller (e.g. Combiflam), fever on day 2"
  person: {age: 68, female: true, weight_kg: 62, height_m: 1.55, egfr: 58, city: Nagpur, occupation: home,
           roof: concrete, cooling: fan, hr_base: 76, sbp_base: 132, beta_blocker: false, cyp2c9: "*1/*1"}
  chronic: {ras: arb, diuretic: chlorthalidone}
  events: {nsaid: {brand: combiflam, per_day: 3, days: [0, 4]}, fever: {excess_c: 1.5, days: [2, 4]}}
  generics: [telmisartan, chlorthalidone, amlodipine]     # chronic medicines, generic names first (what-if levers)
  history: {dm: false, uacr_mg_g: null, heart_failure: false, last_potassium: 4.6}
  expect: "risk rises before AKI; painkiller swap lowers risk; sick-day plan lowest; CYP2C9 *3/*3 highest"
S2_ravi:
  label: "Ravi (fictional), 42, construction worker, Hyderabad, no medicines"
  person: {age: 42, female: false, weight_kg: 68, height_m: 1.68, egfr: 95, city: Hyderabad,
           occupation: construction_farm, roof: tin_asbestos, cooling: none, hr_base: 72, sbp_base: 122,
           beta_blocker: false, cyp2c9: "*1/*1"}
  chronic: {}
  events: {}
  generics: []
  history: {dm: false, uacr_mg_g: null, heart_failure: false, last_potassium: null}
  expect: "transient intra-day rises possible; morning-based risk stays green/amber; no red unless sustained"
S3_fatima:
  label: "Fatima (fictional), 55, Ahmedabad: T2D on metformin + empagliflozin + ramipril; vomiting x4/day"
  person: {age: 55, female: true, weight_kg: 66, height_m: 1.55, egfr: 72, city: Ahmedabad, occupation: home,
           roof: concrete, cooling: cooler, hr_base: 78, sbp_base: 134, beta_blocker: false, cyp2c9: "*1/*1"}
  chronic: {ras: acei, sglt2: true}
  events: {gi: {vomit_per_day: 4, diarrhoea_per_day: 3, days: [1, 3]}}
  generics: [metformin, empagliflozin, ramipril]
  history: {dm: true, uacr_mg_g: null, heart_failure: false, last_potassium: 4.4}
  expect: "red during the vomiting illness; sick-day guidance what-if"
S4_iyer:
  label: "Mr Iyer (fictional), 74, Chennai: CKD G3b, heart failure, loop diuretic, beta-blocker"
  person: {age: 74, female: false, weight_kg: 64, height_m: 1.64, egfr: 35, city: Chennai, occupation: home,
           roof: concrete, cooling: fan, hr_base: 64, sbp_base: 138, beta_blocker: true, cyp2c9: "*1/*1"}
  chronic: {diuretic: furosemide}
  events: {}
  generics: [furosemide, metoprolol, amlodipine]
  history: {dm: false, uacr_mg_g: null, heart_failure: true, last_potassium: 5.0}
  expect: "HR channel down-weighted; weight carries the signal"
S5_hydrated:
  label: "Kamala's neighbour (fictional): same heat, drinks ORS 1 L/day, no painkiller"
  person: {age: 68, female: true, weight_kg: 60, height_m: 1.54, egfr: 62, city: Nagpur, occupation: home,
           roof: concrete, cooling: fan, hr_base: 75, sbp_base: 130, beta_blocker: false, cyp2c9: "*1/*1"}
  chronic: {ras: arb, diuretic: chlorthalidone}
  events: {ors: {l_per_day: 1.0, days: [-7, 6]}}
  generics: [telmisartan, chlorthalidone]
  history: {dm: false, uacr_mg_g: null, heart_failure: false, last_potassium: 4.5}
  expect: "stays green while the naive heat-index rule fires"
S6_cyp2c9:
  label: "Same patient, same ibuprofen dose: CYP2C9 normal (*1/*1) vs poor metaboliser (*3/*3)"
  name: "Kamala, CYP2C9 *3/*3 variant"
  person: {age: 68, female: true, weight_kg: 62, height_m: 1.55, egfr: 58, city: Nagpur, occupation: home,
           roof: concrete, cooling: fan, hr_base: 76, sbp_base: 132, beta_blocker: false, cyp2c9: "*3/*3"}
  chronic: {ras: arb, diuretic: chlorthalidone}
  events: {nsaid: {brand: combiflam, per_day: 3, days: [0, 4]}}
  generics: [telmisartan, chlorthalidone]
  history: {dm: false, uacr_mg_g: null, heart_failure: false, last_potassium: 4.6}
  expect: "poor metaboliser shows visibly higher risk for the same tablets"
