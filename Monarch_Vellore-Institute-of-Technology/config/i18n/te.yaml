redflag.heatstroke.title: "అత్యవసరం: వడదెబ్బ (హీట్‌స్ట్రోక్) అయి ఉండవచ్చు"
redflag.heatstroke.body: "వడదెబ్బ (హీట్‌స్ట్రోక్) అయి ఉండవచ్చు. వెంటనే 108 / 112 కు కాల్ చేయండి. వ్యక్తిని నీడలోకి తీసుకెళ్లి శరీరాన్ని చల్లబరచండి. వ్యక్తి గందరగోళంగా ఉంటే లేదా పూర్తిగా స్పృహలో లేకపోతే తాగడానికి ఏమీ ఇవ్వవద్దు."
redflag.kidney_test_today.title: "అత్యవసరం: ఈరోజే డాక్టర్‌ను కలవండి"
redflag.kidney_test_today.body: "ఈరోజే డాక్టర్‌ను కలవండి; కిడ్నీ రక్త పరీక్ష అవసరం."
redflag.vomiting_review.title: "అత్యవసరం: ఈరోజే డాక్టర్‌ను కలవండి"
redflag.vomiting_review.body: "వాంతుల వల్ల 6 గంటలకు పైగా ద్రవాలు కడుపులో నిలవడం లేదు. ఈరోజే డాక్టర్‌ను కలవండి."
redflag.duration_not_stated: "ఇది ఎంత సేపటి నుంచి ఉందో చెప్పలేదు, కాబట్టి దీన్ని అత్యవసరంగా పరిగణిస్తున్నాం."

ors.drink: "రోజంతా ORS / ఎలక్ట్రోలైట్ పానీయం తాగండి."
ors.doctor_advises: "ద్రవం రకం మరియు మోతాదు మీ డాక్టర్ సలహా ప్రకారం తీసుకోండి."
ors.evidence: "ఎండలో పనిచేసే వారిలో ఎలక్ట్రోలైట్ తీసుకోవడం కిడ్నీ గాయం తక్కువ అవకాశంతో ముడిపడి ఉంది (Butler-Dawson 2019, పరిశీలనా అధ్యయనం)."
ors.caution: "జాగ్రత్త: ఈ రోగికి ORS ఆటోమేటిక్ కాదు."
ors.reason.heart_failure: "గుండె వైఫల్యం (ద్రవం మరియు ఉప్పు భారం)"
ors.reason.egfr_lt_30: "eGFR 30 కంటే తక్కువ"
ors.reason.k_ge_5_5: "చివరి పొటాషియం 5.5 లేదా ఎక్కువ (ORS లో పొటాషియం ఉంటుంది)"

egfr.not_reliable: "క్రియాటినిన్ మారుతున్నప్పుడు ఇది నమ్మదగినది కాదు"
filtration.label: "మోడల్ అంచనా వడపోత (వ్యక్తిగత బేస్‌లైన్‌లో %, ట్విన్ అంచనా)"
risk.below_floor: "<1%"
severity.aki: "కిడ్నీ గాయం (సాధారణంగా తేలికపాటిది, సాధారణంగా కోలుకుంటుంది; పదే పదే వస్తే దీర్ఘకాలంలో వేగంగా క్షీణించడంతో ముడిపడి ఉంది)"

# fast-clock reasons (top-3 contributions; vrikka.fastclock.explain)
reason.mc_risk_72h: "ట్విన్ 72 గంటల అనుకరణలో చాలాసార్లు కిడ్నీ గాయం కనిపించింది"
reason.tw_cr_ratio: "అంచనా క్రియాటినిన్ సాధారణ స్థాయి కంటే ఎక్కువగా ఉంది"
reason.tw_v_ecf: "శరీరంలో ద్రవం తక్కువగా ఉంది (అంచనా డీహైడ్రేషన్)"
reason.tw_v_ecf_sd: "ద్రవ స్థితి అనిశ్చితం (ఇటీవలి రీడింగ్‌లు తక్కువ)"
reason.tw_gfr_frac: "మోడల్ ప్రకారం కిడ్నీ వడపోత బేస్‌లైన్ కంటే తక్కువ"
reason.mc_cr_peak_ratio: "రాబోయే 3 రోజుల్లో క్రియాటినిన్ పెరిగే అవకాశం ఉంది"
reason.mc_gfr_min_frac: "రాబోయే 3 రోజుల్లో కిడ్నీ వడపోత తగ్గే అవకాశం ఉంది"
reason.tw_theta: "ఈ వ్యక్తికి ఎండలో సగటు కంటే ఎక్కువ చెమట పడుతుంది"
reason.fc_sweat_72h: "అంచనా వేడి వల్ల రాబోయే 3 రోజులు ఎక్కువ చెమట"
reason.fc_tmax_72h: "చాలా వేడి రోజులు ఉంటాయని అంచనా"
reason.hot_streak_days: "ఇప్పటికే వరుసగా చాలా వేడి రోజులు"
reason.rep_fever_c: "ఈరోజు జ్వరం ఉందని చెప్పారు"
reason.rep_gi_episodes: "వాంతులు లేదా విరేచనాలు ఉన్నాయని చెప్పారు"
reason.rep_poor_intake: "సాధారణం కంటే తక్కువ తినడం, తాగడం"
reason.rep_ors_l: "ORS / ఎలక్ట్రోలైట్ పానీయం తీసుకున్నారు (రక్షణ)"
reason.nsaid_units_7d: "ఈ వారం ఐబుప్రోఫెన్ లేదా డైక్లోఫెనాక్ వంటి నొప్పి మాత్రలు వేసుకున్నారు"
reason.nsaid_today: "ఈరోజు నొప్పి మాత్ర వేసుకున్నారు (ఉదా. కాంబిఫ్లామ్‌లోని ఐబుప్రోఫెన్)"
reason.on_ras: "ACE-ఇన్హిబిటర్ / ARB రకం బీపీ మందు వేసుకుంటారు"
reason.on_diuretic: "నీటి మాత్ర (డైయూరెటిక్) వేసుకుంటారు"
reason.triple_today: "బీపీ మందు + నీటి మాత్ర + నొప్పి మాత్ర కలిపి (ట్రిపుల్ వామీ)"
reason.age: "ఎక్కువ వయసు (కిడ్నీ నిల్వ తక్కువ)"
reason.egfr_baseline: "ముందు నుంచే కిడ్నీ పనితీరు తక్కువ (CKD)"
reason.heart_failure: "గుండె వైఫల్యం ఉంది"
reason.wt_vs_dry_kg: "ఉదయం బరువు సాధారణం కంటే తక్కువ (ద్రవ నష్టం)"
reason.hr_delta_bpm: "విశ్రాంతి గుండె వేగం సాధారణం కంటే ఎక్కువ"

# alert levels
level.green: "ఆకుపచ్చ: తక్కువ ప్రమాదం"
level.amber: "పసుపు: ప్రమాదం పెరుగుతోంది"
level.red: "ఎరుపు: ఎక్కువ ప్రమాదం"
level.purple: "ఊదా: ల్యాబ్ పరీక్షతో కిడ్నీ గాయం నిర్ధారణ అయింది"
action.green: "ఎప్పటిలాగే కొనసాగండి: రోజంతా నీళ్లు తాగండి, ఎండగా ఉన్నప్పుడు నీడలో విశ్రాంతి తీసుకోండి."
action.amber: "ఈరోజు జాగ్రత్తగా ఉండండి: మీ పరిమితిలో ORS లేదా ద్రవాలు తాగండి, ఐబుప్రొఫెన్ లేదా డైక్లోఫెనాక్ వంటి నొప్పి మాత్రలు వద్దు, నీడలో ఉండండి."
action.red: "ఈరోజే డాక్టర్ చూడాలి, ఇంట్లో కిడ్నీ రక్త పరీక్ష చేయించుకోవాలని సూచన."
action.purple: "ల్యాబ్ పరీక్షలో కిడ్నీ గాయం కనిపించింది: ఈరోజు మీ డాక్టర్ ప్రణాళికను పాటించండి."

# ---- Part 5
lever.continue: "ఇప్పుడు ఉన్నట్లే కొనసాగించండి"
lever.painkiller_swap: "నొప్పి మాత్ర మార్చండి: ఐబుప్రొఫెన్ / డైక్లోఫెనాక్ బదులు పారాసిటమాల్"
lever.ors: "రోజంతా ORS / ఎలక్ట్రోలైట్ పానీయం"
lever.work_shift: "బయటి పనిని తెల్లవారుజామునే చేయండి"
lever.pause_ras: "అనారోగ్యంగా ఉన్నప్పుడు ACE-ఇన్హిబిటర్ / ARB రకం BP మాత్ర ఆపడం గురించి డాక్టర్‌ను అడగండి"
lever.pause_diuretic: "అనారోగ్యంగా ఉన్నప్పుడు మూత్రం మాత్ర (డైయురెటిక్) ఆపడం గురించి డాక్టర్‌ను అడగండి"
lever.pause_sglt2i: "అనారోగ్యంగా ఉన్నప్పుడు SGLT2 ఇన్హిబిటర్ (ఉదా. ఎంపాగ్లిఫ్లోజిన్) ఆపడం గురించి డాక్టర్‌ను అడగండి"
lever.pause_metformin: "అనారోగ్యంగా ఉన్నప్పుడు మెట్‌ఫార్మిన్ ఆపడం గురించి డాక్టర్‌ను అడగండి"
lever.badge_pause: "వ్యక్తిగతం, బలహీనమైన ఆధారం (Think Kidneys 2018), నిర్ణయం డాక్టర్‌దే"
pause_reason.sglt2i: "ఎందుకు: తినకపోయినా లేదా వాంతులు అయినా కీటోఅసిడోసిస్ ప్రమాదం (కిడ్నీ గాయం కాదు)"
pause_reason.metformin: "ఎందుకు: కిడ్నీ గాయం అయితే లాక్టిక్ అసిడోసిస్ ప్రమాదం"
pause_reason.acei: "ఎందుకు: నీరు తగ్గినప్పుడు ఇది కిడ్నీ స్వీయ రక్షణను తగ్గిస్తుంది"
pause_reason.arb: "ఎందుకు: నీరు తగ్గినప్పుడు ఇది కిడ్నీ స్వీయ రక్షణను తగ్గిస్తుంది"
pause_reason.thiazide: "ఎందుకు: నీరు తగ్గినప్పుడు ఇది ఇంకా ద్రవ నష్టం చేస్తుంది"
pause_reason.loop: "ఎందుకు: నీరు తగ్గినప్పుడు ఇది ఇంకా ద్రవ నష్టం చేస్తుంది"
pause_reason.nsaid_cyp2c9: "ఎందుకు: ఇది కిడ్నీ స్వీయ రక్షణను అడ్డుకుంటుంది; పారాసిటమాల్ సాధారణంగా సురక్షితమైన నొప్పి మాత్ర"
pause_reason.nsaid_other: "ఎందుకు: ఇది కిడ్నీ స్వీయ రక్షణను అడ్డుకుంటుంది; పారాసిటమాల్ సాధారణంగా సురక్షితమైన నొప్పి మాత్ర"
guard.hf_diuretic_pause: "హెచ్చరిక: గుండె వైఫల్యం ఉంటే మూత్రం మాత్ర ఆపితే శరీరంలో ద్రవం పేరుకుపోవచ్చు. చికిత్స చేసే డాక్టర్ మాత్రమే నిర్ణయించాలి."
guard.k_caution: "జాగ్రత్త: పొటాషియం 5.5 లేదా ఎక్కువ. ప్రతి మార్పును డాక్టర్‌తో సరిచూసుకోండి."
guard.k_alert: "పొటాషియం 6.0 లేదా ఎక్కువ: ఈరోజే పొటాషియం పరీక్ష మళ్లీ చేయించి, ఇప్పుడే డాక్టర్‌కు తెలియజేయండి."
guard.paracetamol_over: "ఇది ఈ వ్యక్తికి పారాసిటమాల్ సురక్షిత రోజువారీ పరిమితిని దాటుతుంది. డాక్టర్‌ను అడగండి."
guard.cotrimoxazole: "కో-ట్రైమోక్సజోల్ (ఉదా. Septran) క్రియాటినిన్ పెంచవచ్చు, కానీ నిజమైన కిడ్నీ గాయం, ఎక్కువ పొటాషియం కూడా కలిగించవచ్చు: కిడ్నీ హెచ్చరిక అలాగే ఉంటుంది; పొటాషియం పరీక్షించండి."
exclude.under_18: "VrikkaTwin 18 ఏళ్ల లోపు వారి కోసం రూపొందించలేదు."
exclude.pregnancy: "VrikkaTwin గర్భధారణ సమయంలో వాడకం కోసం రూపొందించలేదు."
exclude.egfr_lt_15_or_dialysis: "eGFR 15 కంటే తక్కువ ఉన్నవారు లేదా డయాలసిస్‌లో ఉన్నవారి కోసం VrikkaTwin రూపొందించలేదు."
sickday.ask_pause: "అనారోగ్యంగా ఉన్నప్పుడు {generic} ను కొంతకాలం ఆపాలా అని ఈరోజే మీ డాక్టర్‌ను అడగండి."
sickday.painkiller: "అనారోగ్యంగా ఉన్నప్పుడు {generic} వద్దు; బదులుగా పారాసిటమాల్ గురించి డాక్టర్ లేదా ఫార్మసిస్ట్‌ను అడగండి."
sickday.keep_others: "డాక్టర్ వేరేగా చెప్పకపోతే మీ ఇతర మందులు వేసుకుంటూ ఉండండి."
