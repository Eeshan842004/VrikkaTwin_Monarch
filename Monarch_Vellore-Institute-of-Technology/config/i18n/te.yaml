slow.ranges_only: "దీర్ఘకాల అంచనాలు పరిధులుగా (10-90 %) చూపబడతాయి, ఒకే సంఖ్యగా కాదు."
slow.aki_associated: "ఒక భారతీయ మధుమేహ కిడ్నీ వ్యాధి సమూహంలో కిడ్నీ గాయానికి దీర్ఘకాలంలో eGFR వేగంగా తగ్గడంతో సంబంధం కనిపించింది (ఇది సంబంధం మాత్రమే, కారణానికి రుజువు కాదు)."
slow.aki_extrapolated: "మధుమేహం లేని వారికి ఈ అంకె అంచనాతో విస్తరించబడింది."

