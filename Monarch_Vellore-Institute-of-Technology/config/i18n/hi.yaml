redflag.heatstroke.title: "आपातकाल: संभावित लू (हीटस्ट्रोक)"
redflag.heatstroke.body: "संभावित लू (हीटस्ट्रोक)। अभी 108 / 112 पर कॉल करें। व्यक्ति को छाया में ले जाएँ और शरीर को ठंडा करें। अगर व्यक्ति भ्रमित है या पूरी तरह होश में नहीं है, तो उसे कुछ भी पीने को न दें।"
redflag.kidney_test_today.title: "ज़रूरी: आज ही डॉक्टर को दिखाएँ"
redflag.kidney_test_today.body: "आज ही डॉक्टर को दिखाएँ; किडनी की खून की जाँच ज़रूरी है।"
redflag.vomiting_review.title: "ज़रूरी: आज ही डॉक्टर को दिखाएँ"
redflag.vomiting_review.body: "उल्टी के कारण 6 घंटे से ज़्यादा समय से पानी या कोई तरल पेट में नहीं टिक रहा। आज ही डॉक्टर को दिखाएँ।"
redflag.duration_not_stated: "यह कितने समय से है, यह नहीं बताया गया, इसलिए हम इसे ज़रूरी मान रहे हैं।"

ors.drink: "दिन भर ORS / इलेक्ट्रोलाइट वाला पेय पिएँ।"
ors.doctor_advises: "तरल पदार्थ का प्रकार और मात्रा अपने डॉक्टर की सलाह के अनुसार लें।"
ors.evidence: "गर्मी में काम करने वालों में इलेक्ट्रोलाइट लेना किडनी की चोट के कम जोखिम से जुड़ा पाया गया (Butler-Dawson 2019, अवलोकन अध्ययन)।"
ors.caution: "सावधानी: इस मरीज़ के लिए ORS अपने-आप नहीं।"
ors.reason.heart_failure: "हार्ट फ़ेल्योर (तरल और नमक का भार)"
ors.reason.egfr_lt_30: "eGFR 30 से कम"
ors.reason.k_ge_5_5: "पिछला पोटैशियम 5.5 या ज़्यादा (ORS में पोटैशियम होता है)"

egfr.not_reliable: "क्रिएटिनिन बदल रहा हो तब यह भरोसेमंद नहीं है"
filtration.label: "मॉडल द्वारा अनुमानित फ़िल्ट्रेशन (व्यक्तिगत आधार-रेखा का %, ट्विन अनुमान)"
risk.below_floor: "<1%"
severity.aki: "किडनी की चोट (अक्सर हल्की, अक्सर ठीक हो जाती है; बार-बार होने पर लंबे समय में किडनी तेज़ी से कमज़ोर होने से जुड़ी है)"

