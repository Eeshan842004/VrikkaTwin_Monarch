redflag.heatstroke.title: "ತುರ್ತು: ಬಿಸಿಲಿನ ಆಘಾತ (ಹೀಟ್‌ಸ್ಟ್ರೋಕ್) ಆಗಿರಬಹುದು"
redflag.heatstroke.body: "ಬಿಸಿಲಿನ ಆಘಾತ (ಹೀಟ್‌ಸ್ಟ್ರೋಕ್) ಆಗಿರಬಹುದು. ಈಗಲೇ 108 / 112 ಗೆ ಕರೆ ಮಾಡಿ. ವ್ಯಕ್ತಿಯನ್ನು ನೆರಳಿಗೆ ಕರೆದೊಯ್ದು ದೇಹವನ್ನು ತಣ್ಣಗಾಗಿಸಿ. ವ್ಯಕ್ತಿ ಗೊಂದಲದಲ್ಲಿದ್ದರೆ ಅಥವಾ ಪೂರ್ಣ ಎಚ್ಚರದಲ್ಲಿ ಇಲ್ಲದಿದ್ದರೆ ಕುಡಿಯಲು ಏನನ್ನೂ ಕೊಡಬೇಡಿ."
redflag.kidney_test_today.title: "ತುರ್ತು: ಇಂದೇ ವೈದ್ಯರನ್ನು ಭೇಟಿ ಮಾಡಿ"
redflag.kidney_test_today.body: "ಇಂದೇ ವೈದ್ಯರನ್ನು ಭೇಟಿ ಮಾಡಿ; ಮೂತ್ರಪಿಂಡದ ರಕ್ತ ಪರೀಕ್ಷೆ ಅಗತ್ಯ."
redflag.vomiting_review.title: "ತುರ್ತು: ಇಂದೇ ವೈದ್ಯರನ್ನು ಭೇಟಿ ಮಾಡಿ"
redflag.vomiting_review.body: "ವಾಂತಿಯಿಂದಾಗಿ 6 ಗಂಟೆಗಳಿಗಿಂತ ಹೆಚ್ಚು ಕಾಲ ದ್ರವ ಹೊಟ್ಟೆಯಲ್ಲಿ ನಿಲ್ಲುತ್ತಿಲ್ಲ. ಇಂದೇ ವೈದ್ಯರನ್ನು ಭೇಟಿ ಮಾಡಿ."
redflag.duration_not_stated: "ಇದು ಎಷ್ಟು ಹೊತ್ತಿನಿಂದ ಇದೆ ಎಂದು ತಿಳಿಸಿಲ್ಲ, ಆದ್ದರಿಂದ ನಾವು ಇದನ್ನು ತುರ್ತು ಎಂದು ಪರಿಗಣಿಸುತ್ತಿದ್ದೇವೆ."

ors.drink: "ದಿನವಿಡೀ ORS / ಎಲೆಕ್ಟ್ರೋಲೈಟ್ ಪಾನೀಯ ಕುಡಿಯಿರಿ."
ors.doctor_advises: "ದ್ರವದ ಪ್ರಕಾರ ಮತ್ತು ಪ್ರಮಾಣವನ್ನು ನಿಮ್ಮ ವೈದ್ಯರ ಸಲಹೆಯಂತೆ ತೆಗೆದುಕೊಳ್ಳಿ."
ors.evidence: "ಬಿಸಿಲಿನಲ್ಲಿ ಕೆಲಸ ಮಾಡುವವರಲ್ಲಿ ಎಲೆಕ್ಟ್ರೋಲೈಟ್ ಸೇವನೆ ಮೂತ್ರಪಿಂಡದ ಗಾಯದ ಕಡಿಮೆ ಸಾಧ್ಯತೆಯೊಂದಿಗೆ ಸಂಬಂಧ ಹೊಂದಿದೆ (Butler-Dawson 2019, ವೀಕ್ಷಣಾ ಅಧ್ಯಯನ)."
ors.caution: "ಎಚ್ಚರಿಕೆ: ಈ ರೋಗಿಗೆ ORS ಸ್ವಯಂಚಾಲಿತವಲ್ಲ."
ors.reason.heart_failure: "ಹೃದಯ ವೈಫಲ್ಯ (ದ್ರವ ಮತ್ತು ಉಪ್ಪಿನ ಹೊರೆ)"
ors.reason.egfr_lt_30: "eGFR 30 ಕ್ಕಿಂತ ಕಡಿಮೆ"
ors.reason.k_ge_5_5: "ಕೊನೆಯ ಪೊಟ್ಯಾಸಿಯಮ್ 5.5 ಅಥವಾ ಹೆಚ್ಚು (ORS ನಲ್ಲಿ ಪೊಟ್ಯಾಸಿಯಮ್ ಇರುತ್ತದೆ)"

egfr.not_reliable: "ಕ್ರಿಯಾಟಿನಿನ್ ಬದಲಾಗುತ್ತಿರುವಾಗ ಇದು ವಿಶ್ವಾಸಾರ್ಹವಲ್ಲ"
filtration.label: "ಮಾದರಿ ಅಂದಾಜಿಸಿದ ಶೋಧನೆ (ವೈಯಕ್ತಿಕ ಮೂಲಮಟ್ಟದ %, ಟ್ವಿನ್ ಅಂದಾಜು)"
risk.below_floor: "<1%"
severity.aki: "ಮೂತ್ರಪಿಂಡದ ಗಾಯ (ಸಾಮಾನ್ಯವಾಗಿ ಸೌಮ್ಯ, ಸಾಮಾನ್ಯವಾಗಿ ಗುಣವಾಗುತ್ತದೆ; ಪದೇ ಪದೇ ಆದರೆ ದೀರ್ಘಾವಧಿಯಲ್ಲಿ ವೇಗವಾದ ಕುಸಿತಕ್ಕೆ ಸಂಬಂಧಿಸಿದೆ)"

# fast-clock reasons (top-3 contributions; vrikka.fastclock.explain)
reason.mc_risk_72h: "ಟ್ವಿನ್‌ನ 72 ಗಂಟೆಗಳ ಅನುಕರಣೆಯಲ್ಲಿ ಹಲವು ಬಾರಿ ಮೂತ್ರಪಿಂಡದ ಗಾಯ ಕಂಡಿದೆ"
reason.tw_cr_ratio: "ಅಂದಾಜು ಕ್ರಿಯಾಟಿನಿನ್ ಸಾಮಾನ್ಯ ಮಟ್ಟಕ್ಕಿಂತ ಹೆಚ್ಚಾಗಿದೆ"
reason.tw_v_ecf: "ದೇಹದಲ್ಲಿ ದ್ರವ ಕಡಿಮೆಯಾಗಿದೆ (ಅಂದಾಜು ನಿರ್ಜಲೀಕರಣ)"
reason.tw_v_ecf_sd: "ದ್ರವ ಸ್ಥಿತಿ ಅನಿಶ್ಚಿತ (ಇತ್ತೀಚಿನ ರೀಡಿಂಗ್ ಕಡಿಮೆ)"
reason.tw_gfr_frac: "ಮಾದರಿ ಪ್ರಕಾರ ಮೂತ್ರಪಿಂಡದ ಶೋಧನೆ ಮೂಲಮಟ್ಟಕ್ಕಿಂತ ಕಡಿಮೆ"
reason.mc_cr_peak_ratio: "ಮುಂದಿನ 3 ದಿನಗಳಲ್ಲಿ ಕ್ರಿಯಾಟಿನಿನ್ ಏರುವ ನಿರೀಕ್ಷೆ ಇದೆ"
reason.mc_gfr_min_frac: "ಮುಂದಿನ 3 ದಿನಗಳಲ್ಲಿ ಮೂತ್ರಪಿಂಡದ ಶೋಧನೆ ಇಳಿಯುವ ನಿರೀಕ್ಷೆ ಇದೆ"
reason.tw_theta: "ಈ ವ್ಯಕ್ತಿ ಬಿಸಿಲಿನಲ್ಲಿ ಸರಾಸರಿಗಿಂತ ಹೆಚ್ಚು ಬೆವರುತ್ತಾರೆ"
reason.fc_sweat_72h: "ಮುನ್ಸೂಚಿತ ಬಿಸಿಲಿನಿಂದ ಮುಂದಿನ 3 ದಿನ ಹೆಚ್ಚು ಬೆವರು"
reason.fc_tmax_72h: "ತುಂಬಾ ಬಿಸಿಯಾದ ದಿನಗಳ ಮುನ್ಸೂಚನೆ ಇದೆ"
reason.hot_streak_days: "ಈಗಾಗಲೇ ಸತತ ಹಲವು ಬಿಸಿ ದಿನಗಳು"
reason.rep_fever_c: "ಇಂದು ಜ್ವರ ವರದಿಯಾಗಿದೆ"
reason.rep_gi_episodes: "ವಾಂತಿ ಅಥವಾ ಭೇದಿ ವರದಿಯಾಗಿದೆ"
reason.rep_poor_intake: "ಸಾಮಾನ್ಯಕ್ಕಿಂತ ಕಡಿಮೆ ತಿನ್ನುವುದು-ಕುಡಿಯುವುದು"
reason.rep_ors_l: "ORS / ಎಲೆಕ್ಟ್ರೋಲೈಟ್ ಪಾನೀಯ ತೆಗೆದುಕೊಂಡಿದ್ದಾರೆ (ರಕ್ಷಣೆ)"
reason.nsaid_units_7d: "ಈ ವಾರ ಐಬುಪ್ರೊಫೆನ್ ಅಥವಾ ಡೈಕ್ಲೋಫೆನಾಕ್‌ನಂತಹ ನೋವು ನಿವಾರಕ ತೆಗೆದುಕೊಂಡಿದ್ದಾರೆ"
reason.nsaid_today: "ಇಂದು ನೋವು ನಿವಾರಕ ತೆಗೆದುಕೊಂಡಿದ್ದಾರೆ (ಉದಾ. ಕಾಂಬಿಫ್ಲಾಮ್‌ನಲ್ಲಿನ ಐಬುಪ್ರೊಫೆನ್)"
reason.on_ras: "ACE-ಇನ್ಹಿಬಿಟರ್ / ARB ವಿಧದ ರಕ್ತದೊತ್ತಡ ಔಷಧ ತೆಗೆದುಕೊಳ್ಳುತ್ತಾರೆ"
reason.on_diuretic: "ನೀರಿನ ಮಾತ್ರೆ (ಮೂತ್ರವರ್ಧಕ) ತೆಗೆದುಕೊಳ್ಳುತ್ತಾರೆ"
reason.triple_today: "ರಕ್ತದೊತ್ತಡ ಔಷಧ + ನೀರಿನ ಮಾತ್ರೆ + ನೋವು ನಿವಾರಕ ಒಟ್ಟಿಗೆ (ಟ್ರಿಪಲ್ ವ್ಯಾಮಿ)"
reason.age: "ಹೆಚ್ಚಿನ ವಯಸ್ಸು (ಮೂತ್ರಪಿಂಡದ ಮೀಸಲು ಕಡಿಮೆ)"
reason.egfr_baseline: "ಮೂಲತಃ ಮೂತ್ರಪಿಂಡದ ಕಾರ್ಯ ಕಡಿಮೆ (CKD)"
reason.heart_failure: "ಹೃದಯ ವೈಫಲ್ಯ ಇದೆ"
reason.wt_vs_dry_kg: "ಬೆಳಗಿನ ತೂಕ ಸಾಮಾನ್ಯಕ್ಕಿಂತ ಕಡಿಮೆ (ದ್ರವ ನಷ್ಟ)"
reason.hr_delta_bpm: "ವಿಶ್ರಾಂತಿಯ ಹೃದಯ ಬಡಿತ ಸಾಮಾನ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚು"

