level.red: "ಕೆಂಪು: ಹೆಚ್ಚಿನ ಅಪಾಯ"
level.purple: "ನೇರಳೆ: ಲ್ಯಾಬ್ ಪರೀಕ್ಷೆಯಿಂದ ಕಿಡ್ನಿ ಗಾಯ ದೃಢಪಟ್ಟಿದೆ"
action.green: "ಎಂದಿನಂತೆ ಮುಂದುವರಿಯಿರಿ: ದಿನವಿಡೀ ನೀರು ಕುಡಿಯಿರಿ ಮತ್ತು ಬಿಸಿಲಿನಲ್ಲಿ ನೆರಳಿನಲ್ಲಿ ವಿಶ್ರಾಂತಿ ಪಡೆಯಿರಿ."
action.amber: "ಇಂದು ಎಚ್ಚರವಾಗಿರಿ: ನಿಮ್ಮ ಮಿತಿಯೊಳಗೆ ORS ಅಥವಾ ದ್ರವ ಕುಡಿಯಿರಿ, ಐಬುಪ್ರೊಫೆನ್ ಅಥವಾ ಡೈಕ್ಲೋಫೆನಾಕ್‌ನಂತಹ ನೋವಿನ ಮಾತ್ರೆ ತಪ್ಪಿಸಿ, ನೆರಳಿನಲ್ಲಿರಿ."
action.red: "ಇಂದೇ ವೈದ್ಯರು ನೋಡಬೇಕು ಮತ್ತು ಮನೆಯಲ್ಲಿ ಕಿಡ್ನಿ ರಕ್ತ ಪರೀಕ್ಷೆ ಮಾಡಿಸಲು ಸಲಹೆ."
action.purple: "ಲ್ಯಾಬ್ ಪರೀಕ್ಷೆಯಲ್ಲಿ ಕಿಡ್ನಿ ಗಾಯ ಕಂಡಿದೆ: ಇಂದು ನಿಮ್ಮ ವೈದ್ಯರ ಯೋಜನೆ ಅನುಸರಿಸಿ."

