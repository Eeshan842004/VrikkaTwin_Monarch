guard.k_alert: "ಪೊಟ್ಯಾಸಿಯಮ್ 6.0 ಅಥವಾ ಹೆಚ್ಚು: ಇಂದೇ ಪೊಟ್ಯಾಸಿಯಮ್ ಪರೀಕ್ಷೆ ಮತ್ತೆ ಮಾಡಿಸಿ ಮತ್ತು ಈಗಲೇ ವೈದ್ಯರಿಗೆ ತಿಳಿಸಿ."
guard.paracetamol_over: "ಇದು ಈ ವ್ಯಕ್ತಿಗೆ ಪ್ಯಾರಸಿಟಮಾಲ್‌ನ ಸುರಕ್ಷಿತ ದೈನಂದಿನ ಮಿತಿಯನ್ನು ಮೀರುತ್ತದೆ. ವೈದ್ಯರನ್ನು ಕೇಳಿ."
guard.cotrimoxazole: "ಕೋ-ಟ್ರೈಮೋಕ್ಸಜೋಲ್ (ಉದಾ. Septran) ಕ್ರಿಯೇಟಿನಿನ್ ಹೆಚ್ಚಿಸಬಹುದು, ಆದರೆ ನಿಜವಾದ ಕಿಡ್ನಿ ಗಾಯ ಮತ್ತು ಹೆಚ್ಚಿನ ಪೊಟ್ಯಾಸಿಯಮ್ ಕೂಡ ಉಂಟುಮಾಡಬಹುದು: ಕಿಡ್ನಿ ಎಚ್ಚರಿಕೆ ಉಳಿಯುತ್ತದೆ; ಪೊಟ್ಯಾಸಿಯಮ್ ಪರೀಕ್ಷಿಸಿ."
exclude.under_18: "VrikkaTwin 18 ವರ್ಷಕ್ಕಿಂತ ಕಡಿಮೆ ವಯಸ್ಸಿನವರಿಗೆ ವಿನ್ಯಾಸಗೊಂಡಿಲ್ಲ."
exclude.pregnancy: "VrikkaTwin ಗರ್ಭಾವಸ್ಥೆಯಲ್ಲಿ ಬಳಕೆಗೆ ವಿನ್ಯಾಸಗೊಂಡಿಲ್ಲ."
exclude.egfr_lt_15_or_dialysis: "eGFR 15ಕ್ಕಿಂತ ಕಡಿಮೆ ಇರುವವರು ಅಥವಾ ಡಯಾಲಿಸಿಸ್‌ನಲ್ಲಿರುವವರಿಗೆ VrikkaTwin ವಿನ್ಯಾಸಗೊಂಡಿಲ್ಲ."
sickday.ask_pause: "ಅನಾರೋಗ್ಯದ ಸಮಯದಲ್ಲಿ {generic} ಅನ್ನು ತಾತ್ಕಾಲಿಕವಾಗಿ ನಿಲ್ಲಿಸಬೇಕೇ ಎಂದು ಇಂದೇ ನಿಮ್ಮ ವೈದ್ಯರನ್ನು ಕೇಳಿ."
sickday.painkiller: "ಅನಾರೋಗ್ಯದ ಸಮಯದಲ್ಲಿ {generic} ತಪ್ಪಿಸಿ; ಬದಲಿಗೆ ಪ್ಯಾರಸಿಟಮಾಲ್ ಬಗ್ಗೆ ವೈದ್ಯರು ಅಥವಾ ಫಾರ್ಮಸಿಸ್ಟ್‌ರನ್ನು ಕೇಳಿ."
sickday.keep_others: "ವೈದ್ಯರು ಬೇರೆ ಹೇಳದಿದ್ದರೆ ನಿಮ್ಮ ಇತರ ಔಷಧಿಗಳನ್ನು ತೆಗೆದುಕೊಳ್ಳುತ್ತಿರಿ."
kfre.label: "KFRE: ಡಯಾಲಿಸಿಸ್ ಅಥವಾ ಕಸಿ ಅಗತ್ಯವಾಗುವ ಅಪಾಯ"
kfre.no_uacr: "KFRE ತೋರಿಸಿಲ್ಲ: ಇದಕ್ಕೆ ಮೂತ್ರದ ಆಲ್ಬುಮಿನ್-ಕ್ರಿಯೇಟಿನಿನ್ ಅನುಪಾತ (UACR) ಬೇಕು."
kfre.egfr_too_high: "KFRE ತೋರಿಸಿಲ್ಲ: ಇದು eGFR 10-59ಕ್ಕೆ ಮಾತ್ರ ಮಾನ್ಯ."
kfre.egfr_too_low: "KFRE ತೋರಿಸಿಲ್ಲ: ಇದು eGFR 10-59ಕ್ಕೆ ಮಾತ್ರ ಮಾನ್ಯ."
slow.ranges_only: "ದೀರ್ಘಾವಧಿ ಅಂದಾಜುಗಳನ್ನು ವ್ಯಾಪ್ತಿಯಲ್ಲಿ (10-90 %) ತೋರಿಸಲಾಗುತ್ತದೆ, ಒಂದೇ ಸಂಖ್ಯೆಯಲ್ಲಿ ಅಲ್ಲ."
slow.aki_associated: "ಒಂದು ಭಾರತೀಯ ಮಧುಮೇಹ ಕಿಡ್ನಿ ರೋಗ ಗುಂಪಿನಲ್ಲಿ ಕಿಡ್ನಿ ಗಾಯವು ದೀರ್ಘಾವಧಿಯಲ್ಲಿ eGFR ವೇಗವಾಗಿ ಇಳಿಯುವುದರೊಂದಿಗೆ ಸಂಬಂಧ ಹೊಂದಿತ್ತು (ಸಂಬಂಧ ಮಾತ್ರ, ಕಾರಣದ ಪುರಾವೆ ಅಲ್ಲ)."
slow.aki_extrapolated: "ಮಧುಮೇಹ ಇಲ್ಲದವರಿಗೆ ಈ ಅಂಕಿ ಅಂದಾಜಿನಿಂದ ವಿಸ್ತರಿಸಲಾಗಿದೆ."

