redflag.heatstroke.title: "ತುರ್ತು: ಬಿಸಿಲಿನ ಆಘಾತ (ಹೀಟ್‌ಸ್ಟ್ರೋಕ್) ಆಗಿರಬಹುದು"
redflag.heatstroke.body: "ಬಿಸಿಲಿನ ಆಘಾತ (ಹೀಟ್‌ಸ್ಟ್ರೋಕ್) ಆಗಿರಬಹುದು. ಈಗಲೇ 108 / 112 ಗೆ ಕರೆ ಮಾಡಿ. ವ್ಯಕ್ತಿಯನ್ನು ನೆರಳಿಗೆ ಕರೆದೊಯ್ದು ದೇಹವನ್ನು ತಣ್ಣಗಾಗಿಸಿ. ವ್ಯಕ್ತಿ ಗೊಂದಲದಲ್ಲಿದ್ದರೆ ಅಥವಾ ಪೂರ್ಣ ಎಚ್ಚರದಲ್ಲಿ ಇಲ್ಲದಿದ್ದರೆ ಕುಡಿಯಲು ಏನನ್ನೂ ಕೊಡಬೇಡಿ."
redflag.kidney_test_today.title: "ತುರ್ತು: ಇಂದೇ ವೈದ್ಯರನ್ನು ಭೇಟಿ ಮಾಡಿ"
redflag.kidney_test_today.body: "ಇಂದೇ ವೈದ್ಯರನ್ನು ಭೇಟಿ ಮಾಡಿ; ಮೂತ್ರಪಿಂಡದ ರಕ್ತ ಪರೀಕ್ಷೆ ಅಗತ್ಯ."
redflag.vomiting_review.title: "ತುರ್ತು: ಇಂದೇ ವೈದ್ಯರನ್ನು ಭೇಟಿ ಮಾಡಿ"
redflag.vomiting_review.body: "ವಾಂತಿಯಿಂದಾಗಿ 6 ಗಂಟೆಗಳಿಗಿಂತ ಹೆಚ್ಚು ಕಾಲ ದ್ರವ ಹೊಟ್ಟೆಯಲ್ಲಿ ನಿಲ್ಲುತ್ತಿಲ್ಲ. ಇಂದೇ ವೈದ್ಯರನ್ನು ಭೇಟಿ ಮಾಡಿ."
redflag.duration_not_stated: "ಇದು ಎಷ್ಟು ಹೊತ್ತಿನಿಂದ ಇದೆ ಎಂದು ತಿಳಿಸಿಲ್ಲ, ಆದ್ದರಿಂದ ನಾವು ಇದನ್ನು ತುರ್ತು ಎಂದು ಪರಿಗಣಿಸುತ್ತಿದ್ದೇವೆ."

ors.drink: "ದಿನವಿಡೀ ORS / ಎಲೆಕ್ಟ್ರೋಲೈಟ್ ಪಾನೀಯ ಕುಡಿಯಿರಿ."
ors.doctor_advises: "ದ್ರವದ ಪ್ರಕಾರ ಮತ್ತು ಪ್ರಮಾಣವನ್ನು ನಿಮ್ಮ ವೈದ್ಯರ ಸಲಹೆಯಂತೆ ತೆಗೆದುಕೊಳ್ಳಿ."
ors.evidence: "ಬಿಸಿಲಿನಲ್ಲಿ ಕೆಲಸ ಮಾಡುವವರಲ್ಲಿ ಎಲೆಕ್ಟ್ರೋಲೈಟ್ ಸೇವನೆ ಮೂತ್ರಪಿಂಡದ ಗಾಯದ ಕಡಿಮೆ ಸಾಧ್ಯತೆಯೊಂದಿಗೆ ಸಂಬಂಧ ಹೊಂದಿದೆ (Butler-Dawson 2019, ವೀಕ್ಷಣಾ ಅಧ್ಯಯನ)."
ors.caution: "ಎಚ್ಚರಿಕೆ: ಈ ರೋಗಿಗೆ ORS ಸ್ವಯಂಚಾಲಿತವಲ್ಲ."
ors.reason.heart_failure: "ಹೃದಯ ವೈಫಲ್ಯ (ದ್ರವ ಮತ್ತು ಉಪ್ಪಿನ ಹೊರೆ)"
ors.reason.egfr_lt_30: "eGFR 30 ಕ್ಕಿಂತ ಕಡಿಮೆ"
ors.reason.k_ge_5_5: "ಕೊನೆಯ ಪೊಟ್ಯಾಸಿಯಮ್ 5.5 ಅಥವಾ ಹೆಚ್ಚು (ORS ನಲ್ಲಿ ಪೊಟ್ಯಾಸಿಯಮ್ ಇರುತ್ತದೆ)"

egfr.not_reliable: "ಕ್ರಿಯಾಟಿನಿನ್ ಬದಲಾಗುತ್ತಿರುವಾಗ ಇದು ವಿಶ್ವಾಸಾರ್ಹವಲ್ಲ"
filtration.label: "ಮಾದರಿ ಅಂದಾಜಿಸಿದ ಶೋಧನೆ (ವೈಯಕ್ತಿಕ ಮೂಲಮಟ್ಟದ %, ಟ್ವಿನ್ ಅಂದಾಜು)"
risk.below_floor: "<1%"
severity.aki: "ಮೂತ್ರಪಿಂಡದ ಗಾಯ (ಸಾಮಾನ್ಯವಾಗಿ ಸೌಮ್ಯ, ಸಾಮಾನ್ಯವಾಗಿ ಗುಣವಾಗುತ್ತದೆ; ಪದೇ ಪದೇ ಆದರೆ ದೀರ್ಘಾವಧಿಯಲ್ಲಿ ವೇಗವಾದ ಕುಸಿತಕ್ಕೆ ಸಂಬಂಧಿಸಿದೆ)"
