# Synthetic cohort definition (master plan §11.2). Values are ASSUMPTIONS unless cited in the plan.
# Amendment 2 A2.3 (16 Oct 2026): 10,000 patients for the 2024 training season; the 2025 and 2026 test seasons use the
# same 5,000 separate test patients (own seed, ids T00000...) so no test patient appears in training. Fallback if
# runtime does not allow: n_train_patients 3000 / n_test_patients 3000 with bootstrap CIs everywhere (say so).
n_train_patients: 10000
n_test_patients: 5000
test_pool_seed_offset: 1000     # test patients are drawn with seed + this offset
season: {start: 2024-03-01, end: 2024-06-30}   # 122 days; 2024 heat season (NCDC surveillance: 67,637 suspected heatstroke cases and 374 deaths, 1 Mar-27 Jul 2024; Lok Sabha reply, Aug 2024)
cities:                     # lat, lon (Open-Meteo); share of cohort
  Delhi:     [28.61, 77.21, 0.18]
  Nagpur:    [21.15, 79.09, 0.15]
  Ahmedabad: [23.02, 72.57, 0.14]
  Hyderabad: [17.39, 78.49, 0.14]
  Palasa:    [18.77, 84.41, 0.12]   # Uddanam CKDu region, Srikakulam district, AP
  Chennai:   [13.08, 80.27, 0.12]
  Bengaluru: [12.97, 77.59, 0.15]   # milder control city (sponsor's home)
age: {dist: truncnorm, mean: 58, sd: 13, min: 30, max: 90}
female: 0.48
conditions:
  htn: 0.70
  dm: 0.30
  ckd_g3: 0.15              # eGFR 30-59
  albuminuria_g1g2: 0.10    # UACR >= 30 mg/g with eGFR >= 60
  heart_failure: 0.05
egfr_baseline: {no_ckd: [85, 15], ckd_g3: [45, 8]}   # mean, sd (mL/min/1.73m2)
occupation: {home: 0.45, office: 0.20, vendor: 0.08, delivery: 0.07, construction_farm: 0.20}   # outdoor 35%
meds_given_htn: {acei_arb: 0.65, thiazide: 0.30, loop: 0.06, ccb: 0.50, beta_blocker: 0.20, mra: 0.04}
fixed_dose_combo_share: 0.35   # of ARB+thiazide users, e.g. Telma-H [A]
meds_given_dm: {metformin: 0.85, sglt2i: 0.25, sulfonylurea: 0.35}
nsaid_episode_rate_per_month: {base: 0.4, chronic_pain: 1.5, gout: 1.0}
nsaid_given_pain_or_fever: 0.5          # India self-medication 57-61% [S]
nsaid_mix: {diclofenac: 0.40, ibuprofen_combiflam: 0.30, aceclofenac: 0.15, nimesulide: 0.10, other: 0.05}
illness_rates_per_100_patient_months: {fever: 6, gastroenteritis_summer: 4, sepsis_like_background: 0.3}
cyp2c9_allele_freq: {"*2": 0.03, "*3": 0.11}   # Hardy-Weinberg [S]
lab_schedule_days: {routine_mean: 75, symptom_triggered_prob: 0.4}
wearable_tier_share: {T0: 0.35, T1: 0.45, T2: 0.20}

# ---- added in Part 3 (all [A] unless stated; documented in PROGRESS.md) ----
occupation_routine:          # typical outdoor exposure per occupation (start hour, hours/day, works Sunday share)
  home:              {outdoor_start: 10, outdoor_hours: 1, works_sunday: 1.0}
  office:            {outdoor_start: 9,  outdoor_hours: 1, works_sunday: 0.0}
  vendor:            {outdoor_start: 10, outdoor_hours: 8, works_sunday: 0.5}
  delivery:          {outdoor_start: 11, outdoor_hours: 8, works_sunday: 0.5}
  construction_farm: {outdoor_start: 8,  outdoor_hours: 9, works_sunday: 0.3}
water_access_at_work_outdoor: 0.6
housing_roof: {concrete: 0.70, tin_asbestos: 0.20, thatch: 0.10}
cooling_at_home: {none: 0.25, fan: 0.45, cooler: 0.20, ac: 0.10}
chronic_pain: 0.25           # knee OA / back pain (more NSAID episodes)
gout: 0.05
diuretic_generic: {thiazide: {chlorthalidone: 0.40, hydrochlorothiazide: 0.45, indapamide: 0.15},
                   loop: {furosemide: 0.70, torsemide: 0.30}}
ras_split: {arb: 0.60, acei: 0.40}
nsaid_daily_mg: {diclofenac: 100, ibuprofen: 1200, aceclofenac: 200, nimesulide: 200}   # typical self-medication dose
nsaid_episode_days: [2, 5]
illness_days: {fever: [2, 4], gastroenteritis_summer: [1, 3], sepsis_like_background: [3, 7]}
ors_use_when_ill: 0.30       # share of illness days on which ORS is drunk (0.5-1.0 L/day)
symptom_report_prob: 0.85    # patient/ASHA reports a symptom that day
tablet_report_prob: 0.80     # patient/ASHA reports painkiller tablets that day
adherence: [0.70, 1.00]      # per-patient chronic-medicine adherence (uniform)
wear_time: [0.60, 0.95]      # T1/T2 band wear probability per day (uniform per patient)
scale_use: 0.80              # T1/T2 morning weight on a given day
asha_visit_weekday: 2        # T0 weekly ASHA visit (0 = Monday)
pre_season_labs_days: [-200, -60]
