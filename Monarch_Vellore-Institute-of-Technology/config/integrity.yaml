# Data-integrity gate for device and check-in feeds (master plan §21; Part 6, test S10). Plausibility rules, not model
# constants: a reading outside these limits is REJECTED (never silently clipped) and the rejection is audited.
plausible:
  weight_kg:          {min: 25, max: 250, max_change_per_day: 5}
  resting_hr_bpm:     {min: 25, max: 220}
  sbp_mmhg:           {min: 60, max: 260}
  temperature_c:      {min: 30, max: 45}
  steps:              {min: 0, max: 100000}
  sleep_hours:        {min: 0, max: 24}
  creatinine_mg_dl:   {min: 0.1, max: 20}
  potassium_mmol_l:   {min: 1.5, max: 10}
replay:
  max_age_hours: 48            # a reading older than this at arrival is rejected (stale or replayed)
  max_future_minutes: 10       # clock skew allowed for a reading time-stamped in the future
  nonce_required: true         # every device message carries a nonce; a nonce seen before is a replay
signature:
  algorithm: Ed25519           # devices that registered a public key must sign every message
  required_if_registered: true
