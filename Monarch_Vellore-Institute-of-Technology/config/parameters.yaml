  range: [0.5, 2.0]
  provenance: ASSUMPTION
  source: 1 unit = standard daily dose
  notes: dose for half-max prostaglandin inhibition

# ---------------------------------------------------------------- exertion-related renal vasoconstriction (Decisions v4 2b, v5 C2)
# ex_drop(t) = k_ex x clip((met(t) - ex_met_threshold) / ex_met_span, 0, 1), smoothed with a first-order lag tau_ex_h;
# GFR is multiplied by (1 - ex_drop). All four are ASSUMPTIONS fixed in Amendment 2 BEFORE the L4 / L5 re-runs and never
# fitted to them. GFR falls less than renal plasma flow because the filtration fraction rises.
k_ex:
  value: 0.25
  unit: fraction of GFR lost at full exertion
  range: [0.10, 0.40]
  provenance: ASSUMPTION
  source: Decisions v4 2b; Chapman 2020 (Temperature 8:108) reports a 15-30 % fall in renal PLASMA FLOW with passive heat; no exercise-specific GFR figure was verified
  notes: Amendment 2 A2.4. Not fitted to L4 or L5. Applies only when met exceeds ex_met_threshold, so home-based people are unaffected
tau_ex_h:
  value: 1.0
  unit: h
  range: [0.5, 3.0]
  provenance: ASSUMPTION
  source: Decisions v4 2b
  notes: on/off lag of the exertional GFR fall
ex_met_threshold:
  value: 2.0
  unit: met
  range: [1.5, 2.5]
  provenance: ASSUMPTION
  source: Decisions v4 2b
  notes: below this metabolic rate there is no exertional GFR fall (rest, light housework)
ex_met_span:
  value: 2.0
  unit: met
  range: [1.5, 3.0]
  provenance: ASSUMPTION
  source: Decisions v4 2b
  notes: met range over which the exertion fraction rises from 0 to 1 (full effect at threshold + span)

# ---------------------------------------------------------------- intake and renal water conservation
phi_drink_young:
  value: 0.75
  unit: fraction of sweat replaced by drinking
  range: [0.5, 0.9]
  provenance: ASSUMPTION
  source: voluntary dehydration concept
  notes: age < 60
phi_drink_old:
  value: 0.60
  unit: fraction of sweat replaced by drinking
  range: [0.4, 0.8]
  provenance: ASSUMPTION
  source: weaker thirst with age
  notes: age >= 60
phi_drink_no_water_at_work_mult:
  value: 0.8
  unit: multiplier
  range: [0.6, 1.0]
  provenance: ASSUMPTION
  source: limited water access (Uddanam pattern)
  notes: applied to phi_drink when water_access_at_work is false
phi_drink_sd:
  value: 0.10
  unit: SD of the per-patient drinking fraction
  range: [0.05, 0.15]
  provenance: ASSUMPTION
  source: Decisions v2 A-5b
  notes: cohort draws phi_drink per patient from a Beta distribution with the age-based mean (x0.8 without water at work) and this SD, clipped to [phi_drink_min, phi_drink_max]. TOP-3 TORNADO PARAMETER (with phi_drink_young/old). The twin learns theta_sweat from daily weight and theta multiplies (1 - phi_drink), so it effectively learns each person's NET unreplaced loss; personalisation absorbs this population uncertainty
phi_drink_min:
  value: 0.30
  unit: fraction
  range: [0.30, 0.30]
  provenance: ASSUMPTION
  source: Decisions v2 A-5b
  notes: lower clip for per-patient phi_drink
phi_drink_max:
  value: 0.95
  unit: fraction
  range: [0.95, 0.95]
  provenance: ASSUMPTION
  source: Decisions v2 A-5b
  notes: upper clip for per-patient phi_drink
ors_ecf_frac:
  value: 0.9
  unit: fraction of ORS volume that refills the ECF
  range: [0.7, 1.0]
  provenance: ASSUMPTION
  source: Decisions v2 B2 (ORS is near-isotonic)
  notes: plain water refills the ECF in proportion to v_ecf/v_tot; ORS / electrolyte drink refills this fraction. Evidence badge - electrolyte intake linked to lower AKI odds in heat-exposed workers (Butler-Dawson 2019, observational)
poor_intake_mult:
  value: 0.6
  unit: multiplier
  range: [0.4, 0.8]
  provenance: ASSUMPTION
  source: master plan §7.6
  notes: drinking fraction multiplier on poor-oral-intake days
tau_recover_h:
  value: 12.0
  unit: h
  range: [6.0, 24.0]
  provenance: ASSUMPTION
  source: prototype sweep (master plan §9.1)
  notes: renal water conservation time constant
sickle_trait_tau_mult:
  value: 1.3
  unit: multiplier
  range: [1.0, 1.5]
  provenance: VERIFY
  source: reduced urine-concentrating ability in HbAS
  notes: optional; multiplies tau_recover_h

