# VrikkaTwin Parameter Provenance Registry (master plan §8).
#
# Every model constant lives here. Code reads it through vrikka.config and never hard-codes numbers.
# Fields: value, unit, range [low, high] (used by the tornado sensitivity analysis), provenance, source, notes.
# provenance: CITED (published / textbook), VERIFY (must be checked before quoting), ASSUMPTION (our choice).
# Every ASSUMPTION must carry a range. A new constant enters as ASSUMPTION with a range.

# ---------------------------------------------------------------- body water and volume (§8, §9.4)
ecv_frac:
  value: 0.20
  unit: fraction of body weight
  range: [0.18, 0.22]
  provenance: CITED
  source: textbook physiology
  notes: extracellular volume = ecv_frac x weight
tbw_frac_female:
  value: 0.45
  unit: fraction of body weight
  range: [0.40, 0.50]
  provenance: CITED
  source: textbook physiology
  notes: +tbw_frac_young_bonus if age < 60; creatinine volume of distribution ~ TBW
tbw_frac_male:
  value: 0.50
  unit: fraction of body weight
  range: [0.45, 0.55]
  provenance: CITED
  source: textbook physiology
  notes: +tbw_frac_young_bonus if age < 60
tbw_frac_young_bonus:
  value: 0.05
  unit: fraction of body weight
  range: [0.0, 0.05]
  provenance: CITED
  source: textbook physiology
  notes: applied when age < 60
ecf_frac_sweat:
  value: 0.5
  unit: fraction
  range: [0.3, 0.7]
  provenance: ASSUMPTION
  source: physiology (sweat is hypotonic, part of the water comes from cells)
  notes: share of unreplaced sweat water that leaves the ECF
ecf_frac_gi:
  value: 1.0
  unit: fraction
  range: [0.8, 1.0]
  provenance: ASSUMPTION
  source: near-isotonic GI losses
  notes: vomiting / diarrhoea
ecf_frac_drug:
  value: 1.0
  unit: fraction
  range: [0.8, 1.0]
  provenance: ASSUMPTION
  source: near-isotonic natriuresis
  notes: diuretic / SGLT2i losses

# ---------------------------------------------------------------- autoregulation and GFR (§8, §9.1)
d50:
  value: 0.065
  unit: fraction of ECV lost
  range: [0.04, 0.10]
  provenance: ASSUMPTION
  source: prototype sweep (master plan §9.1)
  notes: ECF-loss fraction at half-max unprotected GFR drop; no drugs + 3 hot days gives ~+0.02 mg/dL, triple + fever crosses +0.3
hill_n:
  value: 3.0
  unit: dimensionless
  range: [2.0, 4.0]
  provenance: ASSUMPTION
  source: threshold-like autoregulation failure
  notes: Hill exponent of h(d)
a_tot_young:
  value: 0.80
  unit: fraction
  range: [0.6, 0.9]
  provenance: ASSUMPTION
  source: kidney reserve falls with age/CKD
  notes: autoregulatory protection for age < 60 and eGFR >= 60
a_tot_old:
  value: 0.60
  unit: fraction
  range: [0.5, 0.75]
  provenance: ASSUMPTION
  source: kidney reserve falls with age/CKD
  notes: protection for age >= 75 or eGFR < 45; linear between a_tot_young and a_tot_old otherwise
aff_share:
  value: 0.5
  unit: fraction
  range: [0.3, 0.7]
  provenance: ASSUMPTION
  source: afferent (prostaglandin) vs efferent (angiotensin II) arms
  notes: prostaglandin share of protection
i_ras:
  value: 0.80
  unit: fraction
  range: [0.6, 0.95]
  provenance: ASSUMPTION
  source: ACEi/ARB pharmacology
  notes: efferent protection blocked by ACEi/ARB at full effect
nsaid_e50:
  value: 1.0
  unit: normalised NSAID units
  range: [0.5, 2.0]
  provenance: ASSUMPTION
  source: 1 unit = standard daily dose
  notes: dose for half-max prostaglandin inhibition

