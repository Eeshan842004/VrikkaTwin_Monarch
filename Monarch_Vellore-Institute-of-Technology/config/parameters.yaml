  value: 10.0
  unit: bpm per degC above 37
  range: [7.0, 13.0]
  provenance: ASSUMPTION
  source: master plan §7.4 / §10.1
  notes: fever term inside the HR measurement model so fever is not read as dehydration
k_bp:
  value: 5.0
  unit: mmHg per L of ECF deficit
  range: [2.0, 10.0]
  provenance: ASSUMPTION
  source: master plan §8
  notes: home SBP fall with deficit
sigma_weight_kg:
  value: 0.4
  unit: kg
  range: [0.2, 0.6]
  provenance: ASSUMPTION
  source: master plan §8; PMData checked (Decisions v1 item 12)
  notes: morning weight measurement noise. PMData weight is self-reported and mostly whole kilograms (11/15 people >=85 % integers, 3-6 distinct values in ~3 months), so its day-to-day SD (median 0.36 kg) reflects rounding, not scale noise; value and range kept
sigma_hr_bpm:
  value: 4.04
  unit: bpm
  range: [3.0, 6.0]
  provenance: CITED
  source: derived from PMData raw Fitbit heart-rate stream (Thambawita et al. 2020, CC BY 4.0); scripts/pmdata_noise.py -> reports/pmdata_noise.json (Decisions v2 A-5a)
  notes: our own nightly resting HR = lowest 30-min rolling mean 00:00-06:00 (nights with >= 4 h data); per-person SD of (daily value - rolling 7-day median); median across 15 people with >= 30 nights = 4.04 bpm (person range 1.7-6.3); floor 3 bpm not needed. Fitbit's smoothed resting_heart_rate (day-to-day SD 1.24 bpm) deliberately not used. Includes true day-to-day physiological variation, so it is an upper bound on pure sensor noise
sigma_hr_beta_blocker_mult:
  value: 1.5
  unit: multiplier on sigma_hr_bpm
  range: [1.25, 2.0]
  provenance: ASSUMPTION
  source: Decisions v2 A-5a (master plan §8 used 6 bpm = 4 x 1.5)
  notes: resting HR noise multiplier for beta-blocker users
sigma_sbp_mmhg:
  value: 8.0
  unit: mmHg
  range: [5.0, 12.0]
  provenance: ASSUMPTION
  source: not in master plan; typical home-cuff variability
  notes: home SBP noise (optional T2 channel)
cr_lab_cv:
  value: 0.05
  unit: coefficient of variation
  range: [0.03, 0.08]
